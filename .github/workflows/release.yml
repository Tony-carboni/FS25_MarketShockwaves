name: release

# Publishes a downloadable zip when a version tag is pushed.
#
#   git tag v0.9.0.0 && git push origin v0.9.0.0
#
# The zip is built here by tools/build.sh rather than uploaded from a laptop, so
# a published build has passed the same syntax check, config validation, doc
# audit and both test suites as any local build. There is no path by which a
# hand-made zip reaches a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (must match modDesc)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 || sudo apt-get install -y lua5.4

      # The tag and modDesc must agree. A release labelled v0.9.0.0 containing a
      # zip that reports 0.1.0.14 in the mod list is the kind of thing that costs
      # a support thread to untangle.
      - name: Version matches modDesc
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          MOD_VERSION=$(grep -oP '(?<=<version>)[^<]+' FS25_MarketShockwaves/modDesc.xml)
          echo "release=$VERSION  modDesc=$MOD_VERSION"
          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::release version $VERSION does not match modDesc $MOD_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build (validates config, audits docs, runs both test suites)
        run: ./tools/build.sh

      # The filename IS the mod name in FS25, so it must stay exactly
      # FS25_MarketShockwaves.zip. Adding a version suffix would rename the mod,
      # orphaning savegame data and breaking the l10n prefix.
      - name: Check the asset name
        run: |
          test -f build/FS25_MarketShockwaves.zip
          unzip -l build/FS25_MarketShockwaves.zip | grep -q 'modDesc.xml'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES=$(cat <<EOF
          **Market Shockwaves $VERSION** — beta.

          Market events move prices along a curve that builds, holds, and corrects
          when the new harvest lands, and those shocks ripple down the production
          chain. 17 events across 6 categories, all configurable in
          ESC → Settings → Game Settings.

          ### Install

          1. Download \`FS25_MarketShockwaves.zip\` below.
          2. Copy it into \`Documents\My Games\FarmingSimulator2025\mods\\\`.
          3. **Delete any older copy first** — the game will happily run the old
             files and the log will look like a code bug.

          Confirm the version in \`log.txt\`: \`Market Shockwaves loading (...) build=...\`

          ### Notes

          - Works on any map; edits no \`fillTypes.xml\` and ships no map data.
          - Singleplayer. Multiplayer sync is planned but not in yet.
          - Do not rename the zip — in FS25 the filename is the mod name.

          Full event reference: [docs/event-review.md](docs/event-review.md).
          Balance feedback is the most useful thing you can send back, especially
          whether the cadence feels right at your season length. Bug reports are
          best with \`log.txt\`.
          EOF
          )
          EXTRA=(--target "$GITHUB_SHA")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            EXTRA=(--verify-tag)     # the tag ref is what triggered this
          fi
          gh release create "$TAG" \
            build/FS25_MarketShockwaves.zip \
            --title "Market Shockwaves $VERSION" \
            --notes "$NOTES" \
            --prerelease \
            "${EXTRA[@]}"
